<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windows 98 Desktop</title>

<style>
    body {
        margin: 0;
        background: #008080;
        font-family: "MS Sans Serif", sans-serif;
        overflow: hidden;
    }

    /* Desktop icons */
    .icon {
        width: 70px;
        text-align: center;
        color: white;
        font-size: 12px;
        cursor: pointer;
        margin: 20px;
        display: inline-block;
    }

    .icon img {
        width: 48px;
        height: 48px;
        image-rendering: pixelated;
    }

    /* Taskbar */
    .taskbar {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 32px;
        background: #c0c0c0;
        border-top: 2px solid #808080;
        box-shadow: inset -1px -1px 0 #ffffff, inset 1px 1px 0 #404040;
        display: flex;
        align-items: center;
        padding: 2px;
    }

    .start-button {
        background: #d4d0c8;
        border: 2px solid #808080;
        box-shadow: inset -1px -1px 0 #ffffff, inset 1px 1px 0 #404040;
        padding: 2px 10px;
        font-size: 14px;
        cursor: pointer;
        margin-right: 10px;
    }

    .start-button:active {
        box-shadow: inset 1px 1px 0 #ffffff, inset -1px -1px 0 #404040;
    }
</style>
</head>
<body>

<!-- Desktop Icons -->
<div class="icon" onclick="openApp('notepad.html')">
    <img src="https://i.imgur.com/5cQXQ0R.png">
    <div>LPAD Notepad</div>
</div>

<div class="icon" onclick="openApp('index.html')">
    <img src="https://i.imgur.com/1mV9ZqM.png">
    <div>Home</div>
</div>

<div class="icon" onclick="openApp('https://thinker-cat.github.io/')">
    <img src="https://i.imgur.com/8tq8p5E.png">
    <div>Thinker Cat</div>
</div>

<!-- Taskbar -->
<div class="taskbar">
    <div class="start-button">Start</div>
</div>

<script>
function openApp(url) {
    window.location.href = url;
}
</script>

</body>
</html>
