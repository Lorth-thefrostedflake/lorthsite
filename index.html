<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LPAD Retro</title>

<style>
    body {
        background: #c0c0c0;
        font-family: "MS Sans Serif", sans-serif;
        color: #000000;
        margin: 0;
        padding: 20px;
        text-align: center;
    }

    h1 {
        font-size: 22px;
        margin-bottom: 5px;
    }

    .subtitle {
        font-size: 12px;
        margin-top: 0;
        margin-bottom: 15px;
    }

    .window {
        width: 700px;
        max-width: 90%;
        margin: 0 auto;
        background: #d4d0c8;
        border: 2px solid #808080;
        box-shadow: inset -1px -1px 0 #ffffff, inset 1px 1px 0 #404040;
        padding: 10px;
    }

    .titlebar {
        background: #000080;
        color: white;
        padding: 4px 6px;
        font-size: 14px;
        text-align: left;
        margin-bottom: 10px;
    }

    textarea {
        width: 100%;
        height: 60vh;
        min-height: 300px;
        background: #ffffff;
        color: #000000;
        border: 2px solid #808080;
        box-shadow: inset -1px -1px 0 #ffffff, inset 1px 1px 0 #404040;
        padding: 10px;
        font-family: "Courier New", monospace;
        font-size: 14px;
        resize: vertical;
        outline: none;
    }

    .toolbar {
        margin-top: 10px;
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        align-items: center;
    }

    .save-status {
        font-size: 12px;
    }

    .btn-row {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
    }

    button {
        background: #d4d0c8;
        border: 2px solid #808080;
        box-shadow: inset -1px -1px 0 #ffffff, inset 1px 1px 0 #404040;
        padding: 4px 10px;
        font-size: 12px;
        cursor: pointer;
        font-family: "MS Sans Serif", sans-serif;
    }

    button:active {
        box-shadow: inset 1px 1px 0 #ffffff, inset -1px -1px 0 #404040;
    }

    .credits {
        margin-top: 10px;
        font-size: 11px;
        color: #303030;
        text-align: right;
    }
</style>
</head>
<body>

<h1>📝 LPAD RETRO</h1>
<p class="subtitle">Windows 98 style — autosaves — export in multiple formats</p>

<div class="window">
    <div class="titlebar">LPAD - Notepad</div>

    <textarea id="noteArea" placeholder="Type here..."></textarea>

    <div class="toolbar">
        <span class="save-status" id="saveStatus">Saved</span>

        <div class="btn-row">
            <button onclick="downloadNote()">Save .txt</button>
            <button onclick="downloadAs('py')">Save .py</button>
            <button onclick="downloadAs('json')">Save .json</button>
            <button onclick="downloadAs('jar')">Save .jar</button>
            <button onclick="clearNote()">Clear</button>
        </div>
    </div>

    <div class="credits">
        Creds to <a href="https://thinker-cat.github.io/" target="_blank">https://thinker-cat.github.io/</a> for source code
    </div>
</div>

<script>
const noteArea = document.getElementById('noteArea');
const saveStatus = document.getElementById('saveStatus');
let saveTimeout;

function loadNote() {
    try {
        const saved = localStorage.getItem('lpad');
        if (saved) noteArea.value = saved;
    } catch (e) {}
}

function saveNote() {
    try {
        localStorage.setItem('lpad', noteArea.value);
        saveStatus.textContent = 'Saved';
    } catch (e) {
        saveStatus.textContent = 'Could not save';
    }
}

noteArea.addEventListener('input', () => {
    saveStatus.textContent = 'Saving...';
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(saveNote, 400);
});

function clearNote() {
    if (confirm('Clear all text?')) {
        noteArea.value = '';
        saveNote();
    }
}

function downloadNote() {
    const blob = new Blob([noteArea.value], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'notes.txt';
    a.click();
    URL.revokeObjectURL(url);
}

function downloadAs(ext) {
    const blob = new Blob([noteArea.value], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `notes.${ext}`;
    a.click();
    URL.revokeObjectURL(url);
}

loadNote();
</script>

</body>
</html>
